<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | College Events</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#1f2937}
header{background:#183b65;color:white;padding:22px 16px;text-align:center}nav{text-align:center;padding:14px;background:#fff}nav a{color:#1769aa;margin:0 12px;text-decoration:none;font-weight:bold}
main{max-width:900px;margin:25px auto;padding:0 16px}.panel{background:white;padding:22px;border-radius:12px;box-shadow:0 5px 18px #17324d15;margin-bottom:22px}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{font-weight:bold;font-size:14px}input,textarea{width:100%;padding:10px;margin-top:6px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}
button{background:#1769aa;color:white;border:0;border-radius:7px;padding:11px 16px;cursor:pointer;font-weight:bold}button:hover{background:#104e82}
.event{border:1px solid #dbe3ed;border-radius:8px;padding:14px;margin-top:12px}.event h3{margin:0 0 8px}.delete{background:#b42318;margin-top:10px}
@media(max-width:600px){form{grid-template-columns:1fr}.full{grid-column:auto}nav a{display:inline-block;margin:5px}}
</style>
</head>
<body>
<header><h1>Admin Dashboard</h1><p>Create and manage college events</p></header>
<nav><a href="index.html">Home</a><a href="user.html">Student Portal</a></nav>
<main>
<section class="panel">
<h2>Add a New Event</h2>
<form id="eventForm">
<div><label for="name">Event Name</label><input id="name" required placeholder="e.g. Tech Fest"></div>
<div><label for="date">Event Date</label><input id="date" type="date" required></div>
<div><label for="venue">Venue</label><input id="venue" required placeholder="e.g. Main Auditorium"></div>
<div><label for="organizer">Organizer</label><input id="organizer" required placeholder="e.g. CSE Department"></div>
<div class="full"><label for="description">Description</label><textarea id="description" required placeholder="Describe the event..."></textarea></div>
<div class="full"><button type="submit">Add Event</button></div>
</form>
</section>
<section class="panel"><h2>Manage Events</h2><div id="eventList"></div></section>
</main>
<script>
const STORAGE_KEY = "collegeEvents";
const getEvents = () => JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
function renderEvents(){
  const list=document.getElementById("eventList"), events=getEvents();
  if(!events.length){list.innerHTML="<p>No events added yet.</p>";return;}
  list.innerHTML="";
  events.forEach((event,index)=>{
    const card=document.createElement("div");card.className="event";
    const title=document.createElement("h3");title.textContent=event.name;
    const details=document.createElement("p");details.textContent=event.date+" | "+event.venue+" | Organizer: "+event.organizer;
    const desc=document.createElement("p");desc.textContent=event.description;
    const del=document.createElement("button");del.className="delete";del.textContent="Delete Event";
    del.addEventListener("click",()=>{const items=getEvents();items.splice(index,1);localStorage.setItem(STORAGE_KEY,JSON.stringify(items));renderEvents();});
    card.append(title,details,desc,del);list.appendChild(card);
  });
}
document.getElementById("eventForm").addEventListener("submit",e=>{
  e.preventDefault();
  const event={name:document.getElementById("name").value.trim(),date:document.getElementById("date").value,venue:document.getElementById("venue").value.trim(),organizer:document.getElementById("organizer").value.trim(),description:document.getElementById("description").value.trim()};
  const events=getEvents();events.push(event);localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
  e.target.reset();renderEvents();alert("Event added successfully!");
});
renderEvents();
</script>
</body>
</html>
